<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Places</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/places.css" />
    <link rel="icon" href="../assets/logo.jpeg">
    <link rel="stylesheet" href="../css/splash.css">
</head>

<body>
    <script src="../js/splash.js"></script>

    <div class="main">

        <div id="page-title">Saved Places</div>
        <div id="places-sub">Loading...</div>

        <div id="filter-bar">
            <button class="active" data-filter="All">All</button>
            <button data-filter="Temple">Temples</button>
            <button data-filter="Restaurant">Restaurants</button>
            <button data-filter="Museum">Museum</button>
            <button data-filter="Nature">Nature</button>
            <button data-filter="Landmark">Landmarks</button>
            <button data-filter="Mall">Malls</button>
            <button data-filter="Resort">Resorts</button>
        </div>

        <div id="places-grid"></div>

        <div id="add-form">
            <h2>Save a New Place</h2>

            <div id="form-row">

                <div class="form-group" style="flex: 2; min-width: 150px;">
                    <label>Place Name</label>
                    <input type="text" id="place-name" placeholder="e.x. Semmozhi Poonga" />
                </div>

                <div class="form-group">
                    <label>Type</label>
                    <select id="place-type">
                        <option>Nature</option>
                        <option>Restaurant</option>
                        <option>Temple</option>
                        <option>Landmark</option>
                        <option>Mall</option>
                        <option>Museum</option>
                        <option>Resort</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="place-city" placeholder="e.x. Coimbatore" />
                </div>

                <div class="form-group" style="max-width: 80px;">
                    <label>Emoji</label>
                    <input type="text" id="place-emoji" placeholder="⛩" maxlength="2" />
                </div>

                <div class="form-group" style="max-width: 90px;">
                    <label>Rating</label>
                    <select id="place-rating">
                        <option>5.0</option>
                        <option>4.5</option>
                        <option>4.0</option>
                        <option>3.5</option>
                        <option>3.0</option>
                        <option>2.5</option>
                        <option>2.0</option>
                        <option>1.5</option>
                        <option>1.0</option>
                    </select>
                </div>

                <button id="save-btn">Save</button>
            </div>
        </div>

    </div>

    <script src="../js/places.js"></script>
</body>

</html>
