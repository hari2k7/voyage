<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Voyage</title>

    <style>
        body {
            margin: 0;
            background: #0f172a;
        }

        #splash {
            position: fixed;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .loader-content {
            text-align: center;
        }

        .logo {
            font-size: 3rem;
            color: white;
            letter-spacing: 3px;
            animation: glow 1.5s infinite alternate;
        }

        #splash {
            position: fixed;
            width: 100%;
            height: 100vh;
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .logo {
            font-size: 3rem;
            color: white;
            letter-spacing: 3px;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px #ffffff;
            }

            to {
                text-shadow: 0 0 20px #ffffff;
            }
        }

        #main-content {
            display: none;
            width: 100%;
            height: 100vh;
        }

        iframe {
            border: none;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 220px;
        }

        .main {
            flex: 1;
        }
    </style>
</head>

<body>

    <div id="splash">
        <div class="loader-content">
            <h1 class="logo">Voyage</h1>
            <div class="spinner"></div>
        </div>
    </div>

    <div id="main-content">

        <div class="container">
            <iframe class="sidebar" src="pages/navbar.html"></iframe>
            <iframe class="main" src="pages/dashboard.html" name="main"></iframe>
        </div>

    </div>

    <script>
        window.addEventListener("load", () => {

            const splash = document.getElementById("splash");
            const mainContent = document.getElementById("main-content");

            setTimeout(() => {

                splash.style.opacity = "0";

                setTimeout(() => {
                    splash.style.display = "none";
                    mainContent.style.display = "block";
                }, 800);

            }, 2000);

        });
    </script>

</body>

</html>
